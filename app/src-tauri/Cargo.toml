[package]
name = "biopass"
version = "1.4.1+freenex.9"
description = "Biometric Authentication System"
authors = ["phucvinh57"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "biopass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"

[dependencies]
libc = "0.2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "=2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
tokio = { version = "1", features = ["rt", "process", "io-util", "sync", "time", "macros", "fs"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rusqlite_migration = "2.6.0"
tempfile = "3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11.0"
futures-util = "0.3"

tokio-util = { version = "0.7", features = ["rt"] }
